[pytest]
# Folder that holds the test files.
testpaths = tests

# Lets tests import from pages/ and utils/ at the project root.
pythonpath = .

# Every test opens pages relative to this address, for example page.goto("/our-games/cart").
base_url = https://www.paradoxinteractive.com

# Default command line options:
#   --browser chromium  run in Chromium (Playwright's build of Chrome)
# pytest runs tests one at a time unless a parallel plugin (pytest-xdist) is installed,
# and it never retries a failed test unless a retry plugin is installed. We use neither,
# on purpose: this is a live production store.
addopts = --browser chromium
